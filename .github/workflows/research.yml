name: Research model

# Trains the calibration model on data that ends where the scanner replay starts,
# then replays the new engine out-of-sample beside the main-branch baseline.
on:
  workflow_dispatch:
    inputs:
      train_days:
        description: 'Training span in days before the replay window (60–730)'
        required: false
        default: '730'
      holdout_days:
        description: 'Out-of-sample replay window in days (30–180)'
        required: false
        default: '90'
      baseline_ref:
        description: 'Commit, tag or branch replayed as the comparison baseline'
        required: false
        default: 'main'
  push:
    branches: ['claude/**']
    paths:
      - 'lib/market/**'
      - 'lib/research/**'
      - 'lib/tracking.ts'
      - 'lib/paper.ts'
      - 'scripts/train-model.ts'
      - 'scripts/validate-scanner.ts'
      - '.github/workflows/research.yml'

permissions:
  contents: read

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_DIRECTORY: data
      TRAIN_DAYS: ${{ inputs.train_days || '730' }}
      HOLDOUT_DAYS: ${{ inputs.holdout_days || '90' }}
      BASELINE_REF: ${{ inputs.baseline_ref || 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - name: Train calibration model before the replay window
        run: npx tsx scripts/train-model.ts --train-days "$TRAIN_DAYS" --holdout-days "$HOLDOUT_DAYS"
        timeout-minutes: 75
      - name: Replay the trained engine out-of-sample
        run: npx tsx scripts/validate-scanner.ts --days "$HOLDOUT_DAYS"
        timeout-minutes: 25
      - name: Replay the baseline revision on the same window
        continue-on-error: true
        run: |
          git clone "https://github.com/${{ github.repository }}.git" baseline
          cd baseline && git checkout --detach "$BASELINE_REF" && npm ci --no-audit --no-fund
          DATA_DIRECTORY=../data/baseline npx tsx scripts/validate-scanner.ts --days "$HOLDOUT_DAYS"
        timeout-minutes: 20
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: research-${{ github.run_id }}
          path: |
            lib/market/model.json
            data/training-report.json
            data/scanner-validation.json
            data/baseline/scanner-validation.json
          if-no-files-found: ignore
          retention-days: 30
